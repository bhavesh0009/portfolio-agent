[PORTFOLIO]
# Maximum number of stocks in portfolio
max_stocks = 7

# Default initial capital (in INR)
initial_capital = 500000

# Default investor profile: aggressive or defensive
investor_profile = aggressive

[ALLOCATION]
# Allocation strategy per stock (in percentage)
# aggressive: Higher allocation to top performers
# defensive: Equal weight distribution
aggressive_top_stock_pct = 50
aggressive_second_stock_pct = 30
aggressive_third_stock_pct = 20

defensive_equal_weight = 33.33

[RISK]
# Risk parameters
max_stock_allocation_pct = 50
min_stock_allocation_pct = 10

[RISK_PARAMETERS]
# Stop-loss and Target parameters for portfolio guidance
# These values are provided by the portfolio builder to guide the portfolio manager

# Stop-loss percentages (decline from entry price)
aggressive_stop_loss_pct = 15
defensive_stop_loss_pct = 8

# Target percentages (gain from entry price)
# Minimum targets
aggressive_target_min_pct = 40
defensive_target_min_pct = 15

# Maximum targets (for aggressive upside scenarios)
aggressive_target_max_pct = 60
defensive_target_max_pct = 25

[NEWS]
# News validation settings
news_lookback_period = 7d
check_news_for_shortlisted = true

[SCREENER]
# Stock screening pagination settings
# Fetch all pages of results (true/false)
fetch_all_pages = true

# Maximum pages to fetch (0 = unlimited, fetch all available pages)
max_pages = 0

# Delay between page requests in seconds (for rate limiting)
page_delay = 1.5

# Result size management
# Maximum stocks to return in API response (excess is stored and sampled)
max_results_to_return = 30

# Enable automatic storage of large result sets
enable_result_storage = true

# Enable coding agent analysis for large result sets
enable_data_analysis = true

# Directory for storing full screening results
storage_directory = .cache/screening_results

[DATABASE]
# SQLite database settings for portfolio storage
# Path to database file
db_path = .cache/portfolio.db

# SQL Agent settings
# Model tier for SQL generation: 'high', 'mid', 'low'
sql_agent_model = mid

# Enable automatic schema initialization
auto_initialize_schema = true

# SQL query timeout in seconds
query_timeout = 30
